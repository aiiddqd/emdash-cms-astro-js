name: Deploy To Test
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: test
      url: https://dev.pokercoachingwp.com/

    steps:
      - name: let's started! 🎉
        run: | 
          echo "name of branch is ${{ github.ref }} and repository is ${{ github.repository }}." 
          echo "The repository has been cloned to the runner. 🖥️ The workflow is now ready to test your code on the runner."

      - name: Check out repository code
        uses: actions/checkout@v3

      - name: List files in the repository
        run: |
          ls -la ${{ github.workspace }}
          echo "This job's status is ${{ job.status }}."

      - name: plugin1
        uses: sand4rt/ftp-deployer@v1.7
        with:
            local_folder: plugin1
            remote_folder: testpc-www/wp-content/plugins/plugin1
            sftp: true
            passive: true
            host: ${{ secrets.DEPLOY_HOST }}
            port: ${{ secrets.SFTP_PORT }}
            username: ${{ secrets.DEPLOY_USERNAME }}
            password: ${{ secrets.DEPLOY_PASS }}

      - name: plugin2
        uses: sand4rt/ftp-deployer@v1.7
        with:
            local_folder: plugin2
            remote_folder: testpc-www/wp-content/plugins/plugin2
            sftp: true
            passive: true
            host: ${{ secrets.DEPLOY_HOST }}
            port: ${{ secrets.SFTP_PORT }}
            username: ${{ secrets.DEPLOY_USERNAME }}
            password: ${{ secrets.DEPLOY_PASS }}


      - run: echo "deployed to url https://dev.pokercoachingwp.com/"
